# site/ 폴더만 공개 페이지로 배포한다. collector/ 와 .github/ 는 배포하지 않는다.
name: 페이지 배포
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # 배포 API가 일시 오류를 내는 일이 있어(2026-11-27·28 두 번) 실패하면 30초 뒤 한 번 더 시도한다.
      - id: configure
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.configure.outcome == 'failure'
        run: sleep 30
      - if: steps.configure.outcome == 'failure'
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
